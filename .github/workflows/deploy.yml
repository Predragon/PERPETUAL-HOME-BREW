name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Collect site files
        run: |
          mkdir dist
          cp -r index.html sw.js manifest.webmanifest fonts icons dist/
          sed -i "s/const VERSION = \".*\";/const VERSION = \"wpt-${GITHUB_SHA::7}\";/" dist/sw.js
          grep "const VERSION" dist/sw.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name perpetual-home-brew --branch main --commit-dirty=true
